# Baseline runtime policy — the Phase-0 wedge, as code.
#
# Ships in OBSERVE mode. That is not timidity, it is the R3 mitigation: a guardrail
# that starts blocking the moment it is installed produces a false block, gets turned
# off, and never gets turned back on. Run it in observe, look at what it *would* have
# done (`nometria policy simulate`), then promote it (`nometria policy enforce`).
key: baseline
name: Baseline runtime guardrails
description: >
  Prompt-injection, PII, secrets and safety enforcement across every surface, with
  indirect injection treated more severely than direct. Controls NOM-RTG-01..05.
version: 1
mode: observe
default_effect: allow
fail_mode: open
scope:
  agents: ["*"]

rules:
  # --- Prompt injection (NOM-RTG-01) ---------------------------------
  - id: injection.direct
    description: Block high-confidence injection or jailbreak in user input.
    when:
      surface: [input]
      detection: {entity_prefix: INJECTION, min_score: 0.85}
    effect: block
    severity: high
    reason: "Prompt-injection or jailbreak attempt detected in user input."
    controls: [NOM-RTG-01]

  - id: injection.indirect
    description: >
      Injection arriving through retrieved content or a tool result. Scored lower
      because it is the *higher* severity case — the payload is in data the agent
      pulled in, where an instruction has no legitimate reason to be — so we want it
      caught at a lower confidence than a direct attempt.
    when:
      surface: [retrieved, tool_result]
      detection: {entity_prefix: INJECTION, min_score: 0.6}
    effect: block
    severity: critical
    reason: "Instruction-like content found in untrusted retrieved or tool content (indirect prompt injection)."
    controls: [NOM-RTG-01, NOM-DSC-05]

  - id: injection.system_prompt_leak
    description: Attempt to extract the system prompt.
    when:
      detection: {entity_prefix: INJECTION.SYSTEM_PROMPT_LEAK, min_score: 0.6}
    effect: block
    severity: medium
    reason: "System-prompt extraction attempt."
    controls: [NOM-RTG-01]

  # --- Secrets (NOM-RTG-03) -------------------------------------------
  - id: secrets.block
    description: Never let a credential transit the agent, in either direction.
    when:
      detection: {entity_prefix: SECRET, min_score: 0.9}
    effect: block
    severity: critical
    reason: "Credential or secret detected; blocked to prevent leakage."
    controls: [NOM-RTG-03]

  # --- PII (NOM-RTG-02) -----------------------------------------------
  - id: pii.outbound_redact
    description: Redact personal data leaving the agent.
    when:
      surface: [output]
      detection: {entity_prefix: PII, min_score: 0.7}
    effect: redact
    redaction: mask
    severity: medium
    reason: "Personal data detected in the response; redacted before delivery."
    controls: [NOM-RTG-02]

  - id: pii.inbound_tokenize
    description: >
      Tokenise personal data before it reaches a third-party model. Tokenising rather
      than masking keeps the value correlatable downstream without exposing it.
    when:
      surface: [input]
      detection: {entity_prefix: PII, min_score: 0.8}
    effect: tokenize
    redaction: tokenize
    severity: medium
    reason: "Personal data detected in the prompt; tokenised before it reaches the model."
    controls: [NOM-RTG-02]

  - id: pii.high_sensitivity
    description: National identifiers and payment cards never leave, in any direction.
    when:
      detection: {entity_prefix: "PII.US_SSN", min_score: 0.9}
    effect: block
    severity: critical
    reason: "High-sensitivity national identifier detected."
    controls: [NOM-RTG-02]

  # --- Safety (NOM-RTG-05) --------------------------------------------
  - id: safety.harm
    when:
      detection: {entity_prefix: SAFETY, min_score: 0.7}
    effect: block
    severity: high
    reason: "Content-safety policy violation."
    controls: [NOM-RTG-05]

  # --- Output contract (NOM-RTG-07) -----------------------------------
  - id: schema.violation
    when:
      surface: [output]
      detection: {entity_prefix: SCHEMA, min_score: 0.9}
    effect: block
    severity: medium
    reason: "Response violates its declared output contract."
    controls: [NOM-RTG-07]

  # --- Degradation (NOM-RTG-06) ---------------------------------------
  - id: pipeline.degraded_high_risk
    description: >
      A high-risk agent running with degraded detectors is escalated rather than
      quietly accepted. Coverage gaps on a high-risk system are a governance event.
    when:
      risk_tier: [high, prohibited]
      detector_degraded: true
    effect: escalate
    severity: medium
    reason: "Detectors degraded while serving a high-risk agent; escalating for review."
    controls: [NOM-RTG-06]
