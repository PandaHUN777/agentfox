# AgentFox — self-hosted control plane.
#
# Self-host is the default and only MVP deployment mode (X-8, P3-8, NFR-4). Nothing
# here reaches the internet at *runtime*: the default model provider is `echo`, egress
# is off, and every classifier's weights are already baked into the gateway image
# (deploy/Dockerfile) rather than fetched on first use. A regulated customer can run
# the built image in an air-gapped VPC and every pillar still functions.
#
# The *build* is a different story once the classifier tier is enabled: fetching
# those weights needs network egress, and Llama Guard additionally needs an HF_TOKEN
# from an account that has accepted Meta's licence — see the `secrets:` block below
# and deploy/Dockerfile's own comments. Set HF_TOKEN in your shell before building:
#
#   export HF_TOKEN=hf_...
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml up
#
#   control plane   http://localhost:3000
#   API + gateway   http://localhost:8080
#   OPA (optional)  http://localhost:8181

name: agentfox

secrets:
  # Backed by the HF_TOKEN environment variable, never written to a file in the
  # repo — `docker compose build` reads it from the shell that invokes it.
  hf_token:
    environment: HF_TOKEN

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentfox
      POSTGRES_PASSWORD: agentfox
      POSTGRES_DB: agentfox
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfox"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Appendix A.1: OPA is the wrapped policy decision engine. It is optional —
  # NOMETRIA_POLICY_ENGINE defaults to `native`, and the OPA adapter falls back to
  # the native evaluator if this container is unreachable, because a policy-engine
  # outage must never take the customer's agent down (NFR-2).
  opa:
    image: openpolicyagent/opa:0.70.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=error"]
    ports:
      - "8181:8181"

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      secrets:
        - hf_token
    environment:
      NOMETRIA_DATABASE_URL: postgresql+psycopg://agentfox:nometria@db:5432/agentfox
      NOMETRIA_ORG_ID: org_default
      NOMETRIA_ENVIRONMENT: production
      # Zero egress by default. Set to "true" and supply a key to use a hosted model.
      NOMETRIA_ALLOW_EGRESS: "false"
      NOMETRIA_DEFAULT_PROVIDER: echo
      # Observe by default: enforcement is something the customer turns on
      # deliberately, after simulating it (PRD R3).
      NOMETRIA_DEFAULT_POLICY_MODE: observe
      NOMETRIA_FAIL_MODE: open
      NOMETRIA_ENFORCEMENT_BUDGET_MS: "100"
      NOMETRIA_DETECTOR_TIMEOUT_MS: "40"
      NOMETRIA_POLICY_ENGINE: native
      NOMETRIA_OPA_URL: http://opa:8181
      # Every detector this image has weights baked in for (deploy/Dockerfile),
      # on top of the 5 zero-dependency defaults. `safety.restricted` is Llama Guard
      # 3-8B — gated behind the flag below, not behind this list alone.
      AGENTFOX_ENABLED_DETECTORS: >-
        ["injection.heuristic","pii.native","secrets.native","safety.lexicon",
        "schema.json","injection.classifier","safety.granite","injection.similarity",
        "safety.restricted"]
      # Appendix A.4: Llama Guard's licence is non-OSI (acceptable-use policy, a
      # >700M-MAU clause) and the code refuses to load it without this being set.
      # Setting it to "1" is a legal decision, not a technical one — confirm you've
      # done the licence review Appendix A.4 calls for before deploying with this on.
      NOMETRIA_ACCEPT_RESTRICTED_MODEL_LICENSES: "1"
      # CHANGE THIS. The checkpoint signing key should live outside the application
      # database and be held by the customer (NFR-7, Appendix E.2.2).
      NOMETRIA_AUDIT_SIGNING_KEY: change-me-before-any-real-deployment
      NOMETRIA_EVIDENCE_DIR: /var/agentfox/evidence
      # The public playground page (dashboard/app/playground) calls this origin
      # directly from the visitor's browser, unauthenticated — additive to the
      # hardcoded localhost origins in gateway/app.py, not a replacement. Only
      # needed once the dashboard is actually reachable from somewhere other than
      # this same machine.
      NOMETRIA_PLAYGROUND_CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - evidence:/var/agentfox/evidence
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: ../dashboard
      dockerfile: ../deploy/Dockerfile.dashboard
    environment:
      # Read at request time, not baked at build time — so one image can be pointed
      # at any control plane.
      NOMETRIA_API_URL: http://gateway:8080
      NOMETRIA_USER: admin@example.com
      # The one deliberate exception to "server-to-server only": the public
      # playground page is a Client Component, so it fetches from the *visitor's
      # browser*, not from this container — it needs an address the browser can
      # reach (the published host port), not the internal Docker DNS name above.
      # Same value as the published `gateway` port mapping below.
      NOMETRIA_PLAYGROUND_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  db-data:
  evidence:
