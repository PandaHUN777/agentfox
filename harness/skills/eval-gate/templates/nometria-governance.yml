# Nometria governance gate — copy to .github/workflows/nometria-governance.yml
# Every step is offline by default (echo provider, SQLite, no egress).
name: nometria-governance
on:
  pull_request:
  push:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    env:
      NOMETRIA_DATABASE_URL: sqlite:///${{ github.workspace }}/.nometria-ci.db
      NOMETRIA_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nometria
        run: pip install "git+https://github.com/architsharm/guardrails.git"
      - name: Initialise (offline, idempotent)
        run: nometria init --env test
      - name: Every model call is governed
        run: nometria check . --fail
      - name: Policy hierarchy has no critical/high lint findings
        run: nometria policy lint
      - name: Business guardrails don't conflict
        run: nometria guardrails check
      # Eval gate: needs a suite with cases in this DB. For a hosted control plane, point
      # NOMETRIA_DATABASE_URL at it (read-only CI credentials) and pass --baseline <run_id>.
      - name: Eval regression gate
        run: |
          nometria seed > /dev/null      # demo suite `support-quality`; replace with your own suite setup
          nometria eval gate support-quality --junit reports/eval.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nometria-eval
          path: reports/
